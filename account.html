<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSTube Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">▶ PSTube</div>
    <a href="index.html" style="color:white">Home</a>
</header>

<main style="max-width:450px;margin:50px auto">

    <h1>Welcome to PSTube!</h1>
    <p>Create your account</p>

    

    <input id="username" type="text"
        placeholder="Username"
        style="width:100%;padding:15px">

    

    <input id="email" type="email"
        placeholder="Email"
        style="width:100%;padding:15px">

    

    <button onclick="alert('Connect a secure authentication service to create your account.')"
        style="padding:15px;width:100%;cursor:pointer">
        Sign Up
    </button>

    

    <p>Already have an account?</p>

    <button onclick="alert('Login will be available after authentication setup.')"
        style="padding:15px;width:100%;cursor:pointer">
        Login
    </button>

</main>

</body>
</html>
