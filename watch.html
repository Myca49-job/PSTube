<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSTube - Watch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
const params = new URLSearchParams(window.location.search);
const title = params.get("title");

if (title) {
    document.getElementById("videoTitle").textContent = title;
}
</script>

<header>
    <div class="logo">▶ PSTube</div>
    <a href="index.html" style="color:white">Home</a>
</header>

<main style="margin-left:0; max-width:1000px; margin:auto">

    <video
        controls
        autoplay
        style="width:100%; border-radius:12px; margin-top:25px"
        src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4">
    </video>

    <h2 style="margin-top:20px">
        Welcome to PSTube!
    </h2>

    <p style="color:#aaa; margin-top:10px">
        Welcome to the PSTube video player.
    </p>

<button onclick="toggleLike(this, 'video1')">
    👍 Like
</button>

<button onclick="toggleSubscribe(this, 'PSTube')">
    Subscribe
</button>

<script src="engagement.js"></script>

</main>

</body>
</html>
